<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile – message actions</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
</style>
<div style="font-family: Inter, system-ui, sans-serif; color: #E6E8EB; background: #050608; width: 390px; height: 844px; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5; overflow: hidden">
<div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column; opacity: 0.4">
<div style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 14px; background: #111418; border-bottom: 1px solid #22262E"><span style="width: 20px; height: 2px; background: #E6E8EB; box-shadow: 0 6px 0 #E6E8EB, 0 -6px 0 #E6E8EB"></span><span style="flex: 1; font-family: 'JetBrains Mono', monospace; font-weight: 600">#frontend</span></div>
<div style="padding: 16px 16px; display: flex; flex-direction: column; gap: 14px">
<span><span style="font-weight: 600; color: #FCD34D">priya</span><br>Pushed the auth refactor. Can someone review PR #42?</span>
<span><span style="font-weight: 600; color: #93C5FD">arjun</span><br>On it. Did you add the reuse-detection test?</span>
</div>
</div>
<div style="padding: 0 12px 12px">
<div style="background: #111418; border: 1px solid #2E3440; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px">
<span style="font-weight: 600; color: #86EFAC">karthik</span> <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">10:11</span>
<p style="margin: 2px 0 0">Message list lags with 10k rows. I'll try virtualization after lunch.</p>
</div>
<section role="dialog" aria-modal="true" aria-label="Message actions" style="background: #111418; border: 1px solid #2E3440; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.5)">
<div style="display: flex; justify-content: center; padding: 8px 0 4px"><span style="width: 36px; height: 4px; border-radius: 999px; background: #2E3440"></span></div>
<div role="group" aria-label="Quick reactions" style="display: flex; justify-content: space-between; padding: 6px 12px 12px; border-bottom: 1px solid #22262E">
<button aria-label="thumbs up" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">👍</button>
<button aria-label="heart" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">❤️</button>
<button aria-label="laughing" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">😂</button>
<button aria-label="party" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">🎉</button>
<button aria-label="eyes" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">👀</button>
<button aria-label="thank you" style="width: 48px; height: 48px; border: none; border-radius: 999px; background: #1A1E25; font-size: 22px; cursor: pointer">🙏</button>
</div>
<div style="display: flex; flex-direction: column; padding: 4px">
<button style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: #E6E8EB; font: inherit; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>Edit message</button>
<button style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: #E6E8EB; font: inherit; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>Copy text</button>
<button style="display: flex; align-items: center; gap: 14px; height: 52px; padding: 0 14px; border: none; border-radius: 8px; background: transparent; color: #F87171; font: inherit; text-align: left; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"></path></svg>Delete message</button>
</div>
</section>
<button style="width: 100%; height: 52px; margin-top: 8px; border: 1px solid #2E3440; border-radius: 14px; background: #111418; color: #E6E8EB; font: inherit; font-weight: 600; cursor: pointer">Cancel</button>
</div>
</div>
</body>
</html>
