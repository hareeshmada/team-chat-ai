<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile – attachments</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
a{color:#A3E635}
</style>
<div style="font-family: Inter, system-ui, sans-serif; color: #E6E8EB; background: #0B0D10; width: 390px; height: 844px; display: flex; flex-direction: column; font-size: 15px; line-height: 1.5; overflow: hidden">
<header style="display: flex; align-items: center; gap: 4px; height: 56px; padding: 0 6px; border-bottom: 1px solid #22262E; background: #111418">
<button aria-label="Open sidebar" style="width: 44px; height: 44px; border: none; border-radius: 6px; background: transparent; color: #E6E8EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><h1 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">#frontend</h1><span style="display: inline-flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF"><span style="width: 6px; height: 6px; border-radius: 999px; background: #4ADE80"></span>3 online</span></div>
<button aria-label="Assistant" style="width: 44px; height: 44px; border: none; border-radius: 6px; background: transparent; color: #E6E8EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A3E635" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path></svg></button>
</header>
<div role="log" aria-label="Messages in #frontend" style="flex: 1; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px">
<article style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; gap: 8px; align-items: baseline"><span style="font-weight: 600; color: #FCD34D">priya</span><time style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">10:02</time></span>
<p style="margin: 0">New empty-state illustration. Thoughts?</p>
<svg viewBox="0 0 400 225" width="100%" role="img" aria-label="empty-state.png" style="display: block; border: 1px solid #22262E; border-radius: 6px; box-sizing: border-box"><rect width="400" height="225" fill="#14181E"></rect><rect x="120" y="58" width="160" height="110" rx="10" fill="#1A1E25" stroke="#2E3440"></rect><text x="200" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="38" fill="#A3E635">#</text></svg>
</article>
<article style="display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; gap: 8px; align-items: baseline"><span style="font-weight: 600; color: #C4B5FD">meera</span><time style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">10:12</time></span>
<p style="margin: 0">Good write-up: <a href="#">blog.acme.dev/chat-render…</a></p>
<a href="#" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid #22262E; border-radius: 6px; background: #111418; color: #E6E8EB; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">blog.acme.dev</span><span style="font-weight: 600; color: #A3E635">How we cut chat render time by 90%</span></a>
</article>
</div>
<div style="padding: 8px 10px 14px; border-top: 1px solid #22262E; background: #111418; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 8px; border: 1px solid #22262E; border-radius: 8px; background: #0B0D10">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px">profiler-after.png</span><span role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="Uploading" style="height: 3px; border-radius: 2px; background: #22262E"><span style="display: block; width: 62%; height: 3px; border-radius: 2px; background: #A3E635"></span></span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">62%</span>
<button aria-label="Cancel upload" style="width: 44px; height: 44px; border: none; border-radius: 6px; background: transparent; color: #9BA3AF; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<button aria-label="Attach photo or file" style="width: 44px; height: 44px; border: 1px solid #2E3440; border-radius: 8px; background: transparent; color: #E6E8EB; cursor: pointer; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<label for="m5-composer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Message #frontend</label>
<input id="m5-composer" placeholder="message #frontend" style="flex: 1; min-width: 0; height: 44px; padding: 0 12px; border: 1px solid #2E3440; border-radius: 8px; background: #0B0D10; color: inherit; font-family: 'JetBrains Mono', monospace; font-size: 14px">
<button aria-label="Send message, waiting for upload" disabled style="width: 44px; height: 44px; border: none; border-radius: 8px; background: #1A1E25; color: #6B7280; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4 20-7z"></path></svg></button>
</div>
</div>
</div>
</body>
</html>
