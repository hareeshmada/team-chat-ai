<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session restore – loading</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0D10}
</style>
<div aria-busy="true" style="font-family: Inter, system-ui, sans-serif; color: #E6E8EB; background: #0B0D10; display: flex; flex-direction: column; min-height: 900px; width: 100%; font-size: 14px; line-height: 1.5; position: relative">
<div aria-hidden="true" style="flex: 1; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 232px; background: #111418; border-right: 1px solid #22262E; padding: 20px 16px; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
<div style="display: flex; gap: 10px; align-items: center"><span style="width: 28px; height: 28px; border-radius: 6px; background: #1A1E25"></span><span style="width: 110px; height: 12px; border-radius: 3px; background: #1A1E25"></span></div>
<span style="height: 34px; border-radius: 6px; background: #1A1E25"></span>
<span style="width: 70px; height: 10px; border-radius: 3px; background: #1A1E25; margin-top: 8px"></span>
<span style="width: 120px; height: 12px; border-radius: 3px; background: #1A1E25"></span>
<span style="width: 96px; height: 12px; border-radius: 3px; background: #1A1E25"></span>
<span style="width: 132px; height: 12px; border-radius: 3px; background: #1A1E25"></span>
<span style="width: 88px; height: 12px; border-radius: 3px; background: #1A1E25"></span>
</div>
<div style="flex: 999 1 560px; display: flex; flex-direction: column">
<div style="height: 57px; border-bottom: 1px solid #22262E; display: flex; align-items: center; padding: 0 20px; gap: 12px; box-sizing: border-box"><span style="width: 100px; height: 14px; border-radius: 3px; background: #1A1E25"></span><span style="width: 220px; height: 10px; border-radius: 3px; background: #15181D"></span></div>
<div style="flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px"><span style="height: 10px; border-radius: 3px; background: #15181D"></span><div style="display: flex; flex-direction: column; gap: 8px"><span style="width: 70px; height: 10px; border-radius: 3px; background: #1A1E25"></span><span style="width: 72%; height: 10px; border-radius: 3px; background: #15181D"></span></div></div>
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px"><span style="height: 10px; border-radius: 3px; background: #15181D"></span><div style="display: flex; flex-direction: column; gap: 8px"><span style="width: 60px; height: 10px; border-radius: 3px; background: #1A1E25"></span><span style="width: 48%; height: 10px; border-radius: 3px; background: #15181D"></span></div></div>
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px"><span style="height: 10px; border-radius: 3px; background: #15181D"></span><div style="display: flex; flex-direction: column; gap: 8px"><span style="width: 80px; height: 10px; border-radius: 3px; background: #1A1E25"></span><span style="width: 84%; height: 10px; border-radius: 3px; background: #15181D"></span><span style="width: 40%; height: 10px; border-radius: 3px; background: #15181D"></span></div></div>
</div>
</div>
</div>

<div role="status" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 320px; max-width: calc(100% - 40px); background: #111418; border: 1px solid #2E3440; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.5)">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 28px; height: 28px; border-radius: 6px; background: #A3E635; color: #0B0D10; display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 12px">tc</span><span style="font-weight: 600">Restoring your session</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 12px">
<span style="color: #9BA3AF"><span style="color: #4ADE80">✓</span>  refresh token</span>
<span style="color: #E6E8EB"><span style="color: #A3E635">›</span>  loading profile<span style="display: inline-block; width: 7px; height: 13px; background: #A3E635; margin-left: 4px; vertical-align: text-bottom"></span></span>
<span style="color: #6B7280">·  connecting to workspace</span>
</div>
<div style="height: 3px; border-radius: 2px; background: #22262E"><div style="width: 45%; height: 3px; border-radius: 2px; background: #A3E635"></div></div>
</div>

<footer aria-hidden="true" style="display: flex; align-items: center; gap: 16px; height: 28px; padding: 0 14px; border-top: 1px solid #22262E; background: #111418; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #9BA3AF">
<span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #FCD34D"></span>connecting…</span>
</footer>
</div>
</body>
</html>
